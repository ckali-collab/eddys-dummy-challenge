[build]
  publish = "dist"
  command = "npm run build"
  # Baut nicht, wenn ein Commit nur docs/ berührt.
  # Netlify zeigt solche Laeufe als "Failed" mit der Meldung
  # "Canceled build due to no content change". Das ist kein Fehler.
  # Ohne Vergleichsstand oder ohne Cache (beide Refs gleich): immer bauen.
  ignore = '''[ -n "$CACHED_COMMIT_REF" ] && [ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' '''

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
