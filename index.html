<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F0EBE1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111610" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dummy Challenge" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Eddy's Dummy Challenge</title>
    <script>
      // Theme vor dem ersten Paint setzen, sonst blitzt bei manueller Wahl kurz das System-Theme auf.
      // Key und Werte müssen zu src/lib/storage.js passen.
      try {
        var t = JSON.parse(localStorage.getItem('edc-v3') || 'null');
        t = t && t.settings && t.settings.theme;
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
